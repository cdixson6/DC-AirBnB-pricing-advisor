<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DC Airbnb Pricing Advisor</title>
    <meta name="description" content="Professional Washington, D.C. Airbnb pricing advisor and comp analysis tool for property management advisors and homeowners." />
    <meta property="og:title" content="DC Airbnb Pricing Advisor" />
    <meta property="og:description" content="Professional Washington, D.C. Airbnb pricing advisor and comp analysis tool for property management advisors and homeowners." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script>
      // Ignore HMR WebSocket errors per AI Studio environment constraints
      window.addEventListener('unhandledrejection', function (e) {
        var reason = e && (e.reason || '');
        var msg = String(reason.message || reason || '');
        var stack = String(reason.stack || '');
        if (msg.indexOf('WebSocket') !== -1 || msg.indexOf('vite:ws') !== -1 || stack.indexOf('@vite/client') !== -1) {
          e.preventDefault();
          if (e.stopImmediatePropagation) e.stopImmediatePropagation();
        }
      });
      window.addEventListener('error', function (e) {
        var msg = String((e && e.message) || '');
        var filename = String((e && e.filename) || '');
        if (msg.indexOf('WebSocket') !== -1 || filename.indexOf('@vite/client') !== -1) {
          e.preventDefault();
          if (e.stopImmediatePropagation) e.stopImmediatePropagation();
        }
      });
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
